[package]
name = "rosezip-app"
version = "0.1.1"
edition = "2021"
description = "RoseZIP desktop app"
license = "GPL-3.0-only"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rosezip-core = { path = "../../crates/core" }

[features]
# Release builds embed the built frontend (dist/) instead of talking to the
# Vite dev server; `cargo build --release` enables it automatically via RUSTFLAGS.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[lib]
name = "rosezip_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
